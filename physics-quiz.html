<title>Grade 9 Electricity Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single reading column, question cards on a faint schematic grid, sticky score bar at the bottom */
:root{
  --bg:#f3f5f8; --grid:#e3e8ef; --surface:#ffffff; --fg:#17202b; --muted:#5a6676;
  --line:#d3dae4; --accent:#1f5fbf; --accent-soft:#e6eefb;
  --good:#1d7a46; --good-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe7e5;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --grid:#18202a; --surface:#161d27; --fg:#e6ebf2; --muted:#93a0b2;
  --line:#2a3442; --accent:#7aa8f0; --accent-soft:#1b2a40;
  --good:#5fd08f; --good-soft:#15291f; --bad:#f08a82; --bad-soft:#2e1816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --grid:#18202a; --surface:#161d27; --fg:#e6ebf2; --muted:#93a0b2;
  --line:#2a3442; --accent:#7aa8f0; --accent-soft:#1b2a40;
  --good:#5fd08f; --good-soft:#15291f; --bad:#f08a82; --bad-soft:#2e1816; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 120px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-size:clamp(28px,6vw,38px);line-height:1.15;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q-head{display:flex;gap:12px;align-items:baseline}
.num{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:4px;flex:none}
.stem{margin:0;font-weight:500;min-width:0}
.list{margin:0;padding-left:22px;color:var(--fg)}
.list li{padding-left:4px}
.opts{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt input{accent-color:var(--accent);margin:0;flex:none;width:18px;height:18px}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);width:16px;flex:none}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.graded .opt{cursor:default}
.graded .opt.correct{background:var(--good-soft);border-color:var(--good)}
.graded .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-size:14px;border-top:1px dashed var(--line);padding-top:10px;color:var(--muted)}
.fb strong{color:var(--fg)}
.fb .ok{color:var(--good);font-weight:600}.fb .no{color:var(--bad);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
button{font:600 15px var(--body);border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
button.primary{background:var(--accent);color:var(--surface)}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.fig{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.fig img{display:block;max-width:100%;height:auto;max-height:260px;margin:0 auto}
.result{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.result .big{font-family:var(--display);font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main>
  <header>
    <span class="eyebrow">Physics · Grade 9 · Semester 1</span>
    <h1>Electricity Practice Quiz</h1>
    <p class="meta">Questions 11 to 20 of the Joint Summative Assessment 2025/2026 (Main), word for word with the original diagrams. Pick one answer for each, then press Check answers.</p>
  </header>
  <div id="result" class="result" hidden></div>
  <form id="quiz"></form>
</main>

  </div>
</div></div>

const L="ABCD", form=document.getElementById("quiz"), statusEl=document.getElementById("status"),
      checkBtn=document.getElementById("check"), resultEl=document.getElementById("result");
let graded=false;
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
form.innerHTML=Q.map((q,i)=>`
 <section class="q" id="q${i}">
  <div class="q-head"><span class="num">${q.n}</span><p class="stem">${esc(q.stem)}</p></div>
  ${q.img?`<figure class="fig"><img src="${IMG[q.img]}" alt="${esc(q.alt)}"></figure>`:""}
  ${q.list?`<ol class="list">${q.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
  ${q.ask?`<p class="stem">${esc(q.ask)}</p>`:""}
  <fieldset class="opts" aria-label="Question ${i+1} options">
   ${q.opts.map((o,j)=>`<label class="opt" data-j="${j}"><input type="radio" name="q${i}" id="q${i}o${j}" value="${j}"><span class="k">${L[j]}.</span><span>${esc(o)}</span></label>`).join("")}
  </fieldset>
  <div class="fb" hidden></div>
 </section>`).join("");
form.style.display="flex";form.style.flexDirection="column";form.style.gap="20px";
function answers(){return Q.map((_,i)=>{const c=form.querySelector(`input[name=q${i}]:checked`);return c?+c.value:null})}
function update(){const n=answers().filter(x=>x!==null).length;if(!graded)statusEl.textContent=`${n} / 10 answered`}
form.addEventListener("change",update);
checkBtn.addEventListener("click",()=>{
  const ans=answers();let score=0;graded=true;
  Q.forEach((q,i)=>{
    const sec=document.getElementById("q"+i),fb=sec.querySelector(".fb"),ok=ans[i]===q.a;if(ok)score++;
    sec.classList.add("graded");
    sec.querySelectorAll(".opt").forEach(l=>{const j=+l.dataset.j;l.querySelector("input").disabled=true;
      if(j===q.a)l.classList.add("correct");else if(j===ans[i])l.classList.add("wrong");});
    fb.innerHTML=`${ans[i]===null?'<span class="no">Not answered.</span>':ok?'<span class="ok">Correct.</span>':'<span class="no">Incorrect.</span>'} <strong>Answer: ${L[q.a]}.</strong> ${esc(q.why)}`;
    fb.hidden=false;
  });
  statusEl.textContent=`Score: ${score} / 10`;checkBtn.disabled=true;
  resultEl.innerHTML=`<span class="big">${score*10}</span><div><strong>${score} of 10 correct</strong><br><span class="meta">${score>=8?"Great work. You have this chapter under control.":score>=5?"Good start. Read the worked answers for the ones you missed.":"Review current, resistance and electrical energy, then try again."}</span></div>`;
  resultEl.hidden=false;window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("reset").addEventListener("click",()=>{
  graded=false;checkBtn.disabled=false;resultEl.hidden=true;
  form.querySelectorAll(".q").forEach(s=>{s.classList.remove("graded");s.querySelector(".fb").hidden=true;
    s.querySelectorAll(".opt").forEach(l=>{l.classList.remove("correct","wrong");const inp=l.querySelector("input");inp.disabled=false;inp.checked=false;});});
  update();window.scrollTo({top:0,behavior:"smooth"});
});
</script>
